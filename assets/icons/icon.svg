<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <!-- Designed on a 32px grid so every shape remains legible at final size. -->
  <!-- Opaque base prevents dark alpha fringes in small native title-bar icons. -->
  <rect width="32" height="32" fill="#fbf3e9"/>
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="#fbf3e9"/>

  <!-- Distinct alarm bells with generous negative space. -->
  <path d="M6.2 10.3C4.9 8.1 5.8 5.2 8.1 4.1c2.1-1 4.5-.3 5.7 1.5L6.2 10.3Z" fill="#b9681f"/>
  <path d="M25.8 10.3c1.3-2.2.4-5.1-1.9-6.2-2.1-1-4.5-.3-5.7 1.5l7.6 4.7Z" fill="#b9681f"/>

  <!-- Top button. -->
  <rect x="14.1" y="3.4" width="3.8" height="1.8" rx=".9" fill="#9b5016"/>
  <rect x="15.25" y="4.6" width="1.5" height="2.1" rx=".35" fill="#9b5016"/>

  <!-- Feet sit behind the body. -->
  <path d="M8.5 25.1 6.9 28c-.4.7-.1 1.5.6 1.8.7.3 1.4 0 1.8-.6l1.6-2.9Z" fill="#9b5016"/>
  <path d="m23.5 25.1 1.6 2.9c.4.7.1 1.5-.6 1.8-.7.3-1.4 0-1.8-.6l-1.6-2.9Z" fill="#9b5016"/>

  <!-- Bold clock casing. -->
  <circle cx="16" cy="18" r="10.8" fill="#b9681f"/>
  <circle cx="16" cy="18" r="8.25" fill="#fff9f1"/>

  <!-- One strong inner ring; extra reference rings were illegible at 32px. -->
  <circle cx="16" cy="18" r="6.45" fill="#efb56d"/>
  <circle cx="16" cy="18" r="4.5" fill="#fff3df"/>

  <!-- High-contrast hand, angled like the reference. -->
  <path d="m15.45 17.45 5.5-5.5 1.1 1.1-5.5 5.5Z" fill="#6f390e"/>
  <circle cx="21.5" cy="12.5" r=".78" fill="#6f390e"/>
  <circle cx="16" cy="18" r="1.65" fill="#6f390e"/>
</svg>
